[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wtc7"
version = "0.1.0"
description = "Staged finite-element re-analysis of WTC 7 (Phase 1: column 79 floor framing)"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wtc7"]
